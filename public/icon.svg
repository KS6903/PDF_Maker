<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PDF Maker">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef5138"/>
      <stop offset="1" stop-color="#ab1f0f"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <!--
    A bold geometric P, centred on the tile: the stem starts 20 in from the
    left and the bowl's semicircle ends 20 in from the right. The counter is
    concentric with the bowl, so the stroke stays even the whole way round and
    the letter still reads as a P at 16px.
  -->
  <path
    fill="#fff"
    fill-rule="evenodd"
    d="M22.5 14.5h12a9.5 9.5 0 0 1 0 19H29v13.5a2.5 2.5 0 0 1-2.5 2.5h-4a2.5 2.5 0 0 1-2.5-2.5v-30a2.5 2.5 0 0 1 2.5-2.5zM29 21.5v5h5.5a2.5 2.5 0 0 0 0-5z"/>
</svg>

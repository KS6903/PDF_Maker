<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Folio">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef5138"/>
      <stop offset="1" stop-color="#ab1f0f"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <!--
    A lotus in bloom: an upright centre petal with two pairs fanning out from a
    single base point at the bottom, each pair shorter and narrower than the
    last so the outline steps down into a bloom.

    The petals are deliberately broad and cupped. Narrow pointed petals
    radiating from one point read as a cannabis leaf, which is what a seven
    petal version of this looked like; widening them and letting neighbours
    overlap is what makes it read as a lotus, and it keeps the silhouette
    legible once it is down at 16px.
  -->
  <g fill="#fff" transform="translate(32 47)">
    <path d="M0 0C-9.02-9.57-9.5-20.88 0-29 9.5-20.88 9.03-9.57 0 0Z"/>
    <path transform="rotate(-38)" d="M0 0C-7.94-8.23-8.36-17.96 0-24.94 8.36-17.96 7.94-8.23 0 0Z"/>
    <path transform="rotate(38)" d="M0 0C-7.94-8.23-8.36-17.96 0-24.94 8.36-17.96 7.94-8.23 0 0Z"/>
    <path transform="rotate(-76)" d="M0 0C-6.99-7.08-7.36-15.44 0-21.45 7.36-15.44 6.99-7.08 0 0Z"/>
    <path transform="rotate(76)" d="M0 0C-6.99-7.08-7.36-15.44 0-21.45 7.36-15.44 6.99-7.08 0 0Z"/>
  </g>
</svg>
